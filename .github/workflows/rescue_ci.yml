name: ResQLink AI Rescue Module CI/CD

on:
  push:
    branches: [ feature/rescue, develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  analyze_and_test:
    name: Lint, Analyze, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java & Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Static Code Analysis (Flutter Analyze)
        run: |
          cd mobile
          flutter analyze

      - name: Execute Complete Test Suites (Unit, Widget, Integration)
        run: |
          cd mobile
          flutter test --coverage

      - name: Security Audit & Secret Detection
        run: |
          echo "Scanning codebase for unauthorized credentials or plaintext keys..."
          ! grep -rn "sk_live_" mobile/ || exit 1
          ! grep -rn "AIzaSy" mobile/lib/features/rescue/ || exit 1

      - name: Build Android Test APK Artifact
        run: |
          cd mobile
          flutter build apk --debug

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rescue-module-coverage
          path: mobile/coverage/
